[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genuity-synthetic"
version = "0.1.0"
description = "Genuity Synthetic: Convert real CSV data to synthetic using CTGAN/TVAE/TabuDiff"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Genuity AI", email = "opensource@genuity.ai" }
]
keywords = ["synthetic data", "tabular", "ctgan", "tvae", "diffusion", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=1.3",
  "numpy>=1.21",
  "scikit-learn>=1.0",
  "torch>=1.9",
  "category-encoders>=2.6",
  "joblib>=1.2",
]

[project.urls]
Homepage = "https://github.com/genuityai/genuity-synthetic"
Repository = "https://github.com/genuityai/genuity-synthetic"
Issues = "https://github.com/genuityai/genuity-synthetic/issues"

[project.scripts]
genuity-synth = "genuity.cli:main"

[tool.setuptools]
packages = [
  "genuity",
]
include-package-data = false


